name: docker

# Builds the development and headless runtime images and runs quickstart
# smoke tests on a synthetic map. Both images reuse the same build stage.
on:
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "CMakeLists.txt"
      - "package.xml"
      - "include/**"
      - "src/**"
      - "launch/**"
      - "param/**"
      - "rviz/**"
      - "scripts/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker image + status smoke test (Jazzy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: lidar_localization_ros2:ci
          load: true
          cache-from: type=gha,scope=docker-jazzy
          cache-to: type=gha,scope=docker-jazzy,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: lidar_localization_ros2:runtime-ci
          load: true
          cache-from: type=gha,scope=docker-jazzy
      - name: Runtime status smoke test
        run: |
          docker run --rm lidar_localization_ros2:runtime-ci \
            /ws/src/lidar_localization_ros2/docker/smoke_status.sh
      - name: Runtime global initialization smoke test
        run: |
          docker run --rm lidar_localization_ros2:runtime-ci \
            /ws/src/lidar_localization_ros2/docker/smoke_status.sh --global
      - name: Status smoke test with RViz (Xvfb)
        run: |
          docker run --rm lidar_localization_ros2:ci \
            /ws/src/lidar_localization_ros2/docker/smoke_status.sh --rviz
