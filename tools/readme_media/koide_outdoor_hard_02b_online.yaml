# Public Koide outdoor_hard_02b replay with online RKO-LIO.
# Replace MAP_OUTDOOR_HARD_PLY; see docs/readme-media.md.
/**:
  ros__parameters:
    registration_method: NDT_OMP
    score_threshold: 6.0
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_num_threads: 4
    ndt_max_iterations: 35
    gicp_corr_randomness: 20
    gicp_max_correspondence_distance: 2.0
    vgicp_voxel_resolution: 1.0
    transform_epsilon: 0.01
    voxel_leaf_size: 0.5
    enable_scan_voxel_filter: true
    scan_max_range: 100.0
    scan_min_range: 1.0
    scan_period: 0.1
    use_pcd_map: true
    map_path: MAP_OUTDOOR_HARD_PLY
    set_initial_pose: false
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_odom: false
    use_twist_prediction: false
    twist_prediction_use_angular_velocity: false
    max_twist_prediction_dt: 0.5
    use_imu: false
    use_imu_preintegration: false
    imu_preintegration_use_base_frame_transform: false
    imu_prediction_correction_guard_translation_m: 2.0
    imu_prediction_correction_guard_yaw_deg: 4.0
    enable_reinitialization_request_output: true
    enable_reinitialization_request_latch: true
    reinitialization_trigger_threshold: 0.95
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_fitness_explosion_threshold: 1000.0
    enable_debug: false
    predict_pose_from_previous_delta: true
    enable_local_map_crop: true
    local_map_radius: 75.0
    local_map_update_distance: 10.0
    local_map_min_points: 100
    reject_above_score_threshold: true
    enable_borderline_seed_rejection_gate: true
    borderline_seed_gate_score_threshold: 5.25
    borderline_seed_gate_min_seed_translation_m: 1.0
    enable_map_odom_tf: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: livox_frame
    enable_timer_publishing: false
    pose_publish_frequency: 30.0
    use_sim_time: true
    use_odom_tf_prediction: true
    publish_bridge_pose_when_lost: true
    use_continuous_time_deskew: true
    path_max_poses: 2000
    point_timestamp_unit: auto
    enable_soft_odom_correction_gate: false
    qos_overrides./livox/points.subscription.reliability: reliable
    cloud_queue_depth: 10
